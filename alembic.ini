# Alembic configuration for agent-comms-mcp.
#
# The database URL is NOT stored here — migrations/env.py reads DATABASE_URL
# from the environment (fail-fast), matching the service's own config path.
# Run migrations with:  uv run alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url deliberately unset — resolved from DATABASE_URL in env.py
# (tests override it programmatically via Config.set_main_option).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
