# Build, push to dev ECR, and deploy to dev ECS on every full release.
# Pre-releases (GitHub "pre-release" flag) skip this workflow entirely --
# the `if: !prerelease` guard on deploy-dev prevents both jobs from running.
# After dev is stable, deploy-prod promotes the same image to prod ECR and deploys.
#
# Four IAM roles are involved, two per environment:
# - ECR push role (rh-platform{,-dev}-github-actions-ecr-push-role): org-wide
#   trust (any redesignhealth/* repo's main branch), PLUS this repo's own
#   tag-ref subject (dev) / environment:production subject (prod) added
#   specifically because this workflow triggers on `release: published`, not
#   main. Carries ECR push/pull permissions only -- nothing reclaw-comms-
#   specific, since its trust is shared with every other org repo.
# - ECS deploy role (rh-platform{,-dev}-github-actions-ecs-deploy-reclaw-comms-role):
#   trusted ONLY by this repo's own OIDC subjects (same tag-ref/environment
#   split as above, immutable repo-ID form). Carries everything reclaw-comms-
#   specific: ECS RegisterTaskDefinition/UpdateService/PassRole, and (prod
#   only) read access to the dev ECR repo for image promotion.
# The tag-ref and environment:production subjects are mutually exclusive per
# role instance (dev role never trusts environment:production; prod role
# never trusts the tag ref) -- see rh-data-platform's iam.tf for the
# `local.is_prod` gating. deploy-prod switches between its two roles multiple
# times in a single job -- see the inline comments on each
# configure-aws-credentials step.
name: Deploy to ECS

on:
  release:
    types: [published]

# Serialize entire workflow runs so dev and prod steps from different releases
# never interleave.
concurrency:
  group: deploy
  cancel-in-progress: false

# Default all jobs to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest
    # Skip pre-releases — only deploy on full releases.
    if: ${{ !github.event.release.prerelease }}
    # No environment: — OIDC sub is ref:refs/tags/* which the dev role trusts.
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      image-digest: ${{ steps.push-dev.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify CI passed for this SHA
        # Requires a successful push-triggered CI run on the exact commit being deployed.
        # Uses the workflow filename (ci.yml) rather than the display name to avoid
        # silently breaking if the workflow's `name:` field is ever renamed.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          count=$(gh run list \
            --repo "$GH_REPO" \
            --commit "$GH_SHA" \
            --workflow ci.yml \
            --status success \
            --event push \
            --branch main \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No successful push-triggered CI run found for $GH_SHA — refusing to deploy." >&2
            echo "Ensure the commit is merged to main and CI has passed before creating a release." >&2
            exit 1
          fi
          echo "CI check passed for $GH_SHA."

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecr-push-role
          role-session-name: agent-comms-dev-ecr-push
          aws-region: us-east-1

      - name: Login to ECR (dev)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image (dev)
        id: push-dev
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          docker build -t "$DEV_IMAGE" .
          docker push "$DEV_IMAGE"
          # ECR describe-images is reliable after a completed push — the ECR push API
          # is synchronous and the image is indexed before docker push returns.
          DIGEST=$(aws ecr describe-images \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --image-ids imageTag=sha-"$GH_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "ERROR: could not retrieve dev ECR image digest after push" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (dev ECS deploy)
        # ECS RegisterTaskDefinition/DescribeTaskDefinition/UpdateService/
        # DescribeServices/TagResource + PassRole (to the execution and task
        # roles) live on a dedicated role, not the ECR push role above -- that
        # role's trust policy is org-wide (any redesignhealth/* repo's main
        # branch), so ECS deploy + PassRole for reclaw-comms must not live in
        # its inline policy. This role trusts the same tag-ref OIDC subject as
        # the ECR push role above (repo:redesignhealth/agent-comms-mcp:ref:
        # refs/tags/v*), scoped only to agent-comms-mcp's own immutable repo
        # ID -- see rh-data-platform's iam.tf for the exact trust policy and
        # full action set.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecs-deploy-reclaw-comms-role
          role-session-name: agent-comms-dev-ecs-deploy
          aws-region: us-east-1

      - name: Download current dev task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rh-reclaw-comms-dev \
            --query taskDefinition \
            --output json > /tmp/task-def-dev.json

      - name: Update app container image in dev task definition
        env:
          # Use digest reference to pin the exact image pushed — tags are mutable.
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp@${{ steps.push-dev.outputs.digest }}
        run: |
          python3 - <<'EOF'
          import json, sys, os
          IMAGE = os.environ['IMAGE']
          with open('/tmp/task-def-dev.json') as f:
              td = json.load(f)
          if not any(c['name'] == 'app' for c in td['containerDefinitions']):
              print("ERROR: no container named 'app' in dev task definition", file=sys.stderr)
              sys.exit(1)
          for c in td['containerDefinitions']:
              if c['name'] == 'app':
                  c['image'] = IMAGE
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/task-def-dev.json', 'w') as f:
              json.dump(td, f)
          EOF

      - name: Deploy to ECS (dev)
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a # v2.2.0
        with:
          task-definition: /tmp/task-def-dev.json
          service: rh-reclaw-comms-dev
          cluster: rh-platform-dev-cluster
          wait-for-service-stability: true

  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    # OIDC sub is environment:production — prod ECR role trusts only this sub,
    # ensuring prod image promotion cannot be triggered by unprotected jobs.
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials (prod ECS deploy — dev image read)
        # ReadDevECRForPromotion (read-only access to the dev reclaw-comms-mcp
        # ECR repo) lives on the dedicated deploy role, not the org-wide ECR
        # push role — that role's trust is org-wide (any redesignhealth/*
        # repo's main branch), so a reclaw-comms-specific grant has no reason
        # to be reachable by every other repo's CI just because they also
        # assume the shared push role.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecs-deploy-reclaw-comms-role
          role-session-name: agent-comms-prod-ecr-read
          aws-region: us-east-1

      - name: Login to ECR (dev image read)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Verify deploy role can pull dev ECR image
        # Tests both ecr:BatchGetImage and ecr:GetDownloadUrlForLayer — the two permissions
        # that docker pull uses. batch-get-image exits 0 even on ImageNotFoundException
        # (misses go to failures[]), so we check both exit code and output.
        env:
          DIGEST: ${{ needs.deploy-dev.outputs.image-digest }}
        run: |
          # 1. Test ecr:BatchGetImage (manifest read)
          if ! MANIFEST=$(aws ecr batch-get-image \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifest' --output text); then
            echo "ERROR: deploy role BatchGetImage failed for dev ECR image ($DIGEST). Check ReadDevECRForPromotion IAM permission." >&2
            exit 1
          fi
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "ERROR: deploy role cannot find dev ECR image ($DIGEST) — image not found." >&2
            exit 1
          fi
          # 2. Test ecr:GetDownloadUrlForLayer (layer URL fetch) using the first layer digest.
          # Fail explicitly if we can't extract a layer digest — a parse failure that silently
          # skips this check would defeat the purpose of the probe.
          if ! LAYER_DIGEST=$(echo "$MANIFEST" | python3 -c \
            "import json,sys; m=json.load(sys.stdin); layers=m.get('layers',m.get('fsLayers',[])); print(layers[0].get('digest',layers[0].get('blobSum',''))) if layers else sys.exit(1)"); then
            echo "ERROR: could not extract layer digest from dev ECR manifest — manifest format unexpected." >&2
            exit 1
          fi
          if [ -z "$LAYER_DIGEST" ] || [ "$LAYER_DIGEST" = "None" ]; then
            echo "ERROR: empty layer digest extracted from dev ECR manifest." >&2
            exit 1
          fi
          if ! aws ecr get-download-url-for-layer \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --layer-digest "$LAYER_DIGEST" > /dev/null; then
            echo "ERROR: deploy role GetDownloadUrlForLayer failed for dev ECR image. Check ReadDevECRForPromotion IAM permission." >&2
            exit 1
          fi
          echo "Dev ECR pull access confirmed (BatchGetImage + GetDownloadUrlForLayer)."

      - name: Pull dev image (by digest)
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp@${{ needs.deploy-dev.outputs.image-digest }}
          PROD_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker pull "$DEV_IMAGE"
          docker tag "$DEV_IMAGE" "$PROD_IMAGE"

      - name: Configure AWS credentials (prod ECR push)
        # Switch to the org-wide ECR push role for the actual write to prod
        # ECR — the deploy role above has no write access to rh-platform/apps/*.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          role-session-name: agent-comms-prod-ecr-push
          aws-region: us-east-1

      - name: Login to ECR (prod push)
        # `amazon-ecr-login` writes a static bearer token to the docker config
        # at the time it runs (it does not install a credential helper that
        # re-authenticates per docker command), so this second explicit login
        # is load-bearing after the role switch above — the earlier "Login to
        # ECR (dev image read)" token would otherwise still be in effect and
        # lack push access to rh-platform/apps/*. Do not remove this step.
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push image to prod ECR
        id: push-prod
        env:
          PROD_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          docker push "$PROD_IMAGE"
          PROD_DIGEST=$(aws ecr describe-images \
            --repository-name rh-platform/apps/reclaw-comms-mcp \
            --image-ids imageTag=sha-"$GH_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$PROD_DIGEST" ] || [ "$PROD_DIGEST" = "None" ]; then
            echo "ERROR: could not verify prod ECR image after push — push may have failed" >&2
            exit 1
          fi
          echo "Prod ECR push confirmed: $PROD_DIGEST"
          echo "prod-digest=$PROD_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (prod ECS deploy)
        # ECS RegisterTaskDefinition/DescribeTaskDefinition/UpdateService/
        # DescribeServices/TagResource + PassRole (to the execution and task
        # roles) live on the dedicated role, not the ECR push role above --
        # that role's trust policy is org-wide (any redesignhealth/* repo's
        # main branch), so ECS deploy + PassRole for reclaw-comms must not
        # live in its inline policy. This role is trusted only by
        # agent-comms-mcp's own OIDC subjects. Re-assumed here since the
        # previous two steps switched to the ECR push role for the prod push.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecs-deploy-reclaw-comms-role
          role-session-name: agent-comms-prod-ecs-deploy
          aws-region: us-east-1

      - name: Download current prod task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rh-reclaw-comms \
            --query taskDefinition \
            --output json > /tmp/task-def-prod.json

      - name: Update app container image in prod task definition
        env:
          # Use digest reference to pin the exact image pushed — tags are mutable.
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp@${{ steps.push-prod.outputs.prod-digest }}
        run: |
          python3 - <<'EOF'
          import json, sys, os
          IMAGE = os.environ['IMAGE']
          with open('/tmp/task-def-prod.json') as f:
              td = json.load(f)
          if not any(c['name'] == 'app' for c in td['containerDefinitions']):
              print("ERROR: no container named 'app' in prod task definition", file=sys.stderr)
              sys.exit(1)
          for c in td['containerDefinitions']:
              if c['name'] == 'app':
                  c['image'] = IMAGE
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/task-def-prod.json', 'w') as f:
              json.dump(td, f)
          EOF

      - name: Deploy to ECS (prod)
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a # v2.2.0
        with:
          task-definition: /tmp/task-def-prod.json
          service: rh-reclaw-comms
          cluster: rh-platform-cluster
          wait-for-service-stability: true
