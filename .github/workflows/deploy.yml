# Build, push to dev ECR, and deploy to dev ECS on every full release.
# Pre-releases (GitHub "pre-release" flag) are skipped — deploy-dev has an
# `if: !prerelease` guard so neither job runs on pre-releases.
# After dev is stable, deploy-prod promotes the dev-validated image to prod ECR and deploys.
# IAM trust: deploy-dev uses ref:refs/tags/*; deploy-prod uses environment:production.
# The prod ECR push role trusts only environment:production — it cannot be assumed
# from unprotected jobs for any release that actually reaches deploy-prod.
name: Deploy to ECS

on:
  release:
    types: [published]

# Serialize entire workflow runs so dev and prod steps from different releases
# never interleave.
concurrency:
  group: deploy
  cancel-in-progress: false

# Default all jobs to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest
    # Skip pre-releases — only deploy on full releases.
    if: ${{ !github.event.release.prerelease }}
    # No environment: — OIDC sub is ref:refs/tags/* which the dev role trusts.
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      image-digest: ${{ steps.push-dev.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify CI passed for this SHA
        # Requires a successful push-triggered CI run on the exact commit being deployed.
        # Uses the workflow filename (ci.yml) rather than the display name to avoid
        # silently breaking if the workflow's `name:` field is ever renamed.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          count=$(gh run list \
            --repo "$GH_REPO" \
            --commit "$GH_SHA" \
            --workflow ci.yml \
            --status success \
            --event push \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No successful push-triggered CI run found for $GH_SHA — refusing to deploy." >&2
            echo "Ensure the commit is merged to main and CI has passed before creating a release." >&2
            exit 1
          fi
          echo "CI check passed for $GH_SHA."

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (dev)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image (dev)
        id: push-dev
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker build -t "$DEV_IMAGE" .
          docker push "$DEV_IMAGE"
          # Retrieve digest from the local Docker daemon's record of the pushed image.
          # Using docker inspect avoids a separate ECR API call and any indexing delay.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$DEV_IMAGE" | cut -d'@' -f2)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "ERROR: could not retrieve image digest after push" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download current dev task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rh-reclaw-comms-dev \
            --query taskDefinition \
            --output json > /tmp/task-def-dev.json

      - name: Update app container image in dev task definition
        env:
          # Use digest reference to pin the exact image pushed — tags are mutable.
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp@${{ steps.push-dev.outputs.digest }}
        run: |
          python3 - <<'EOF'
          import json, sys, os
          IMAGE = os.environ['IMAGE']
          with open('/tmp/task-def-dev.json') as f:
              td = json.load(f)
          if not any(c['name'] == 'app' for c in td['containerDefinitions']):
              print("ERROR: no container named 'app' in dev task definition", file=sys.stderr)
              sys.exit(1)
          for c in td['containerDefinitions']:
              if c['name'] == 'app':
                  c['image'] = IMAGE
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/task-def-dev.json', 'w') as f:
              json.dump(td, f)
          EOF

      - name: Deploy to ECS (dev)
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a # v2.2.0
        with:
          task-definition: /tmp/task-def-dev.json
          service: rh-reclaw-comms-dev
          cluster: rh-platform-dev-cluster
          wait-for-service-stability: true

  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    # OIDC sub is environment:production — prod ECR role trusts only this sub,
    # ensuring prod image promotion cannot be triggered by unprotected jobs.
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Verify prod role can pull dev ECR image
        # The prod role has ReadDevECRForPromotion permissions on rh-platform-dev/apps/reclaw-comms-mcp.
        # batch-get-image tests ecr:BatchGetImage (same as docker pull). Exit code is 0 even on
        # ImageNotFoundException, so we check the images[] array length in the output.
        env:
          DIGEST: ${{ needs.deploy-dev.outputs.image-digest }}
        run: |
          FOUND=$(aws ecr batch-get-image \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageId.imageDigest' --output text 2>&1)
          if [ -z "$FOUND" ] || [ "$FOUND" = "None" ]; then
            echo "ERROR: prod role cannot pull dev ECR image ($DIGEST). Check ReadDevECRForPromotion IAM permission." >&2
            exit 1
          fi
          echo "Dev ECR pull access confirmed: $FOUND"

      - name: Promote dev image to prod ECR (by digest)
        id: push-prod
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp@${{ needs.deploy-dev.outputs.image-digest }}
          PROD_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker pull "$DEV_IMAGE"
          docker tag "$DEV_IMAGE" "$PROD_IMAGE"
          docker push "$PROD_IMAGE"
          PROD_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$PROD_IMAGE" | cut -d'@' -f2)
          if [ -z "$PROD_DIGEST" ] || [ "$PROD_DIGEST" = "None" ]; then
            echo "ERROR: could not verify prod ECR image after push — push may have failed" >&2
            exit 1
          fi
          echo "Prod ECR push confirmed: $PROD_DIGEST"
          echo "prod-digest=$PROD_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download current prod task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rh-reclaw-comms \
            --query taskDefinition \
            --output json > /tmp/task-def-prod.json

      - name: Update app container image in prod task definition
        env:
          # Use digest reference to pin the exact image pushed — tags are mutable.
          IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp@${{ steps.push-prod.outputs.prod-digest }}
        run: |
          python3 - <<'EOF'
          import json, sys, os
          IMAGE = os.environ['IMAGE']
          with open('/tmp/task-def-prod.json') as f:
              td = json.load(f)
          if not any(c['name'] == 'app' for c in td['containerDefinitions']):
              print("ERROR: no container named 'app' in prod task definition", file=sys.stderr)
              sys.exit(1)
          for c in td['containerDefinitions']:
              if c['name'] == 'app':
                  c['image'] = IMAGE
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/task-def-prod.json', 'w') as f:
              json.dump(td, f)
          EOF

      - name: Deploy to ECS (prod)
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a # v2.2.0
        with:
          task-definition: /tmp/task-def-prod.json
          service: rh-reclaw-comms
          cluster: rh-platform-cluster
          wait-for-service-stability: true
