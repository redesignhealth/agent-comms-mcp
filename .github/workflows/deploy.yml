# Build and push reclaw-comms-mcp's image to dev ECR, then prod ECR, on every
# full release. Pre-releases (GitHub "pre-release" flag) skip this workflow
# entirely -- the `if: !prerelease` guard on deploy-dev prevents both jobs
# from running.
#
# ACTUAL DEPLOYMENT TO ECS IS NOT DONE HERE -- two control planes that can
# disagree will disagree (issue #7795, 2026-08-15 outage postmortem). This
# workflow used to call ECS RegisterTaskDefinition/UpdateService directly, in
# addition to rh-data-platform's Terraform separately declaring this
# service's image tag and applying it via `deploy-reclaw-comms.yml` ->
# `deploy-terraform.yml`. Terraform never learned what the direct path had
# deployed, so its declared tag could drift from what was live -- which is
# what caused the outage (a tag Terraform still referenced had aged out of
# ECR's "keep last 10" lifecycle policy).
#
# Fix: remove the second path, don't sync it. deploy-prod's last step
# dispatches rh-data-platform's deploy-reclaw-comms.yml with the tag just
# pushed to both ECR repos -- that workflow's own deploy-terraform.yml calls
# are the ONLY thing that ever calls RegisterTaskDefinition/UpdateService for
# this service now, matching every other service on the shared `mcp-server`
# Terraform module. No shared-module change was needed: Terraform already
# owned the ECS resources and already had a workflow built to bump the tag
# and apply it. The only other change was stripping the ECS/PassRole grants
# this repo's role no longer uses (see rh-data-platform's iam.tf).
#
# Three IAM roles are involved:
# - ECR push role, dev (rh-platform-dev-github-actions-ecr-push-role) and
#   prod (rh-platform-github-actions-ecr-push-role): org-wide trust (any
#   redesignhealth/* repo's main branch), PLUS this repo's own tag-ref
#   subject (dev) / environment:production subject (prod) added specifically
#   because this workflow triggers on `release: published`, not main. Carries
#   ECR push/pull permissions only -- nothing reclaw-comms-specific, since
#   its trust is shared with every other org repo.
# - Dev-ECR-read role (rh-platform-github-actions-ecs-deploy-reclaw-comms-role,
#   prod instance only -- deploy-dev no longer assumes this role at all now
#   that it does nothing ECS-related): trusted only by this repo's own
#   environment:production OIDC subject. Its ONLY remaining permission is
#   read access to the dev ECR repo, so deploy-prod can pull the exact same
#   image bytes dev already pushed and promote them to prod ECR without a
#   second build. ("Validated" is the wrong word now -- dev ECS never runs
#   this image before prod promotion; only ECR push/pull happens here.)
#   See the inline comment on its configure-aws-credentials step below, and
#   rh-data-platform's iam.tf for the canonical (now much shorter) action
#   list -- every ECS/PassRole statement that used to live on this role has
#   been deleted, not merely left unused.
#
# deploy-prod's last two steps are NOT one of those three roles: they use a
# GitHub App token (RH_DATA_PLATFORM_DISPATCH_APP_ID/_PRIVATE_KEY secrets) to
# dispatch rh-data-platform's own deploy-reclaw-comms.yml, which is what
# actually deploys the image to both ECS services. See that step's inline
# comment and github.com/redesignhealth/rh-data-platform/issues/7795 for why.
name: Build and Release (deploys via rh-data-platform Terraform)

on:
  release:
    types: [published]

# Serialize entire workflow runs so dev and prod steps from different releases
# never interleave.
concurrency:
  group: deploy
  cancel-in-progress: false

# Default all jobs to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest
    # Skip pre-releases — only deploy on full releases.
    if: ${{ !github.event.release.prerelease }}
    # No environment: — OIDC sub is ref:refs/tags/* which the dev role trusts.
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      image-digest: ${{ steps.push-dev.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify CI passed for this SHA
        # Requires a successful push-triggered CI run on the exact commit being deployed.
        # Uses the workflow filename (ci.yml) rather than the display name to avoid
        # silently breaking if the workflow's `name:` field is ever renamed.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          count=$(gh run list \
            --repo "$GH_REPO" \
            --commit "$GH_SHA" \
            --workflow ci.yml \
            --status success \
            --event push \
            --branch main \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No successful push-triggered CI run found for $GH_SHA — refusing to deploy." >&2
            echo "Ensure the commit is merged to main and CI has passed before creating a release." >&2
            exit 1
          fi
          echo "CI check passed for $GH_SHA."

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecr-push-role
          role-session-name: agent-comms-dev-ecr-push
          aws-region: us-east-1

      - name: Login to ECR (dev)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image (dev)
        id: push-dev
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          docker build -t "$DEV_IMAGE" .
          docker push "$DEV_IMAGE"
          # ECR describe-images is reliable after a completed push — the ECR push API
          # is synchronous and the image is indexed before docker push returns.
          DIGEST=$(aws ecr describe-images \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --image-ids imageTag=sha-"$GH_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "ERROR: could not retrieve dev ECR image digest after push" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # No ECS deploy here (issue #7795) -- dev ECS deployment happens via
      # deploy-prod's dispatch of rh-data-platform's deploy-reclaw-comms.yml
      # below, which applies both dev and prod through Terraform in one run.

  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    # OIDC sub is environment:production — prod ECR role trusts only this sub,
    # ensuring prod image promotion cannot be triggered by unprotected jobs.
    permissions:
      id-token: write
    steps:
      - name: Configure AWS credentials (dev image read for promotion)
        # ReadDevECRForPromotion (read-only access to the dev reclaw-comms-mcp
        # ECR repo) lives on this dedicated role, not the org-wide ECR push
        # role — that role's trust is org-wide (any redesignhealth/* repo's
        # main branch), so a reclaw-comms-specific grant has no reason to be
        # reachable by every other repo's CI just because they also assume
        # the shared push role. This role carries NO ECS permissions (issue
        # #7795) -- its only remaining purpose is this read, for promoting
        # the exact dev image to prod ECR below.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecs-deploy-reclaw-comms-role
          role-session-name: agent-comms-prod-ecs-deploy-dev-read
          aws-region: us-east-1

      - name: Login to ECR (dev image read)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Verify deploy role can pull dev ECR image
        # Tests both ecr:BatchGetImage and ecr:GetDownloadUrlForLayer — the two permissions
        # that docker pull uses. batch-get-image exits 0 even on ImageNotFoundException
        # (misses go to failures[]), so we check both exit code and output.
        env:
          DIGEST: ${{ needs.deploy-dev.outputs.image-digest }}
        run: |
          # 1. Test ecr:BatchGetImage (manifest read)
          if ! MANIFEST=$(aws ecr batch-get-image \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifest' --output text); then
            echo "ERROR: deploy role BatchGetImage failed for dev ECR image ($DIGEST). Check ReadDevECRForPromotion IAM permission." >&2
            exit 1
          fi
          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "ERROR: deploy role cannot find dev ECR image ($DIGEST) — image not found." >&2
            exit 1
          fi
          # 2. Test ecr:GetDownloadUrlForLayer (layer URL fetch) using the first layer digest.
          # Fail explicitly if we can't extract a layer digest — a parse failure that silently
          # skips this check would defeat the purpose of the probe.
          if ! LAYER_DIGEST=$(echo "$MANIFEST" | python3 -c \
            "import json,sys; m=json.load(sys.stdin); layers=m.get('layers',m.get('fsLayers',[])); print(layers[0].get('digest',layers[0].get('blobSum',''))) if layers else sys.exit(1)"); then
            echo "ERROR: could not extract layer digest from dev ECR manifest — manifest format unexpected." >&2
            exit 1
          fi
          if [ -z "$LAYER_DIGEST" ] || [ "$LAYER_DIGEST" = "None" ]; then
            echo "ERROR: empty layer digest extracted from dev ECR manifest." >&2
            exit 1
          fi
          if ! aws ecr get-download-url-for-layer \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --layer-digest "$LAYER_DIGEST" > /dev/null; then
            echo "ERROR: deploy role GetDownloadUrlForLayer failed for dev ECR image. Check ReadDevECRForPromotion IAM permission." >&2
            exit 1
          fi
          echo "Dev ECR pull access confirmed (BatchGetImage + GetDownloadUrlForLayer)."

      - name: Pull dev image (by digest)
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp@${{ needs.deploy-dev.outputs.image-digest }}
          PROD_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker pull "$DEV_IMAGE"
          docker tag "$DEV_IMAGE" "$PROD_IMAGE"

      - name: Configure AWS credentials (prod ECR push)
        # Switch to the org-wide ECR push role for the actual write to prod
        # ECR — the deploy role above has no write access to rh-platform/apps/*.
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          role-session-name: agent-comms-prod-ecr-push
          aws-region: us-east-1

      - name: Login to ECR (prod push)
        # `amazon-ecr-login` writes a static bearer token to the docker config
        # at the time it runs (it does not install a credential helper that
        # re-authenticates per docker command), so this second explicit login
        # is load-bearing after the role switch above -- the earlier "Login to
        # ECR (dev image read)" token would otherwise still be in effect and
        # lack push access to rh-platform/apps/*. Do not remove this step.
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Push image to prod ECR
        env:
          PROD_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          docker push "$PROD_IMAGE"
          PROD_DIGEST=$(aws ecr describe-images \
            --repository-name rh-platform/apps/reclaw-comms-mcp \
            --image-ids imageTag=sha-"$GH_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ -z "$PROD_DIGEST" ] || [ "$PROD_DIGEST" = "None" ]; then
            echo "ERROR: could not verify prod ECR image after push — push may have failed" >&2
            exit 1
          fi
          echo "Prod ECR push confirmed: $PROD_DIGEST"

      # rh-data-platform/issues/7795 (2026-08-15 dev+prod outage postmortem):
      # this workflow used to deploy reclaw-comms-mcp to ECS directly here
      # (RegisterTaskDefinition/UpdateService), completely out-of-band from
      # rh-data-platform's Terraform, which separately declares this
      # service's image tag in
      # infrastructure/environments/{dev,prod}/terraform.tfvars
      # (reclaw_comms_image_tag) and applies it via
      # `.github/workflows/deploy-reclaw-comms.yml` +
      # `terraform.yml` (dev auto-applies on every merge to rh-data-platform's
      # main). Two independent control planes able to disagree is what caused
      # the outage: the direct-ECS path deployed a tag Terraform never
      # learned about, and the next dev auto-apply reverted the ECS service
      # back to the stale tag still pinned in tfvars -- which had, by then,
      # aged out of ECR's "keep last 10 sha-tagged images" lifecycle policy.
      #
      # Fix: the direct-ECS steps are REMOVED, not synced. This step below
      # dispatches rh-data-platform's deploy-reclaw-comms.yml with the exact
      # tag just pushed to both ECR repos above -- that workflow's
      # deploy-terraform.yml calls are now the ONLY thing that ever calls
      # RegisterTaskDefinition/UpdateService for this service, so there is
      # exactly one deploy path and nothing left to drift. This needed no
      # shared-module change (`infrastructure/modules/mcp-server`) at all --
      # Terraform already owned the ECS resources and already had this exact
      # workflow built to bump the tag and apply it; the only IAM change was
      # deleting the ECS/PassRole grants the dev-ECR-read role no longer
      # uses (see rh-data-platform's iam.tf). This intentionally does not
      # touch IAM/OIDC trust otherwise: it reuses rh-data-platform's existing
      # deploy-reclaw-comms.yml exactly as designed, via a plain
      # `gh workflow run` dispatch, the same mechanism deploy-terraform.yml
      # uses for its own cross-job GitHub App token.
      #
      # UNLIKE the old sync-only design, a failure here now means the
      # service was NOT deployed -- this is the only deploy mechanism left,
      # not a best-effort tfvars sync running after an already-completed ECS
      # deploy. Don't read a red run here as "safe, just drifted"; the new
      # image never reached ECS.
      #
      # deploy-reclaw-comms.yml's single dispatch covers BOTH dev and prod in
      # one run (its deploy-dev and deploy-prod jobs both fire from this one
      # workflow_dispatch, gated only on the image tag already existing in
      # both ECR repos, which it does by the time this step runs) -- no
      # separate dev-side dispatch is needed.
      #
      # Requires two repo secrets here (RH_DATA_PLATFORM_DISPATCH_APP_ID /
      # RH_DATA_PLATFORM_DISPATCH_APP_PRIVATE_KEY) for a GitHub App
      # installed on rh-data-platform with `actions: write` -- provisioning
      # that app/installation and adding these secrets is a one-time,
      # human/infra-owner action (see issue #7795 and docs/RELEASING.md's
      # Prerequisites section); this step fails loudly, not silently, until
      # that's done.
      - name: Generate rh-data-platform dispatch token
        id: rh-data-platform-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RH_DATA_PLATFORM_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RH_DATA_PLATFORM_DISPATCH_APP_PRIVATE_KEY }}
          owner: redesignhealth
          repositories: rh-data-platform
          # Downscope to exactly the permission this token is used for --
          # without this it carries every permission the App installation
          # has been granted on rh-data-platform, not just Actions.
          permission-actions: write

      - name: Deploy via rh-data-platform's deploy-reclaw-comms.yml
        # `gh workflow run` only enqueues the dispatch -- it returns 0 the
        # moment GitHub's API accepts the request, before the workflow even
        # starts. A bare dispatch with no outcome check would report this
        # job green even if deploy-reclaw-comms.yml then failed (bad image
        # tag, tfvars merge conflict, a permissions problem) and the actual
        # ECS deploy never happened -- silently recreating issue #7795 one
        # hop downstream. So this step polls the dispatched run to
        # completion and fails if it fails.
        #
        # `gh run list --limit 1` alone is not enough to identify OUR run: if
        # GitHub hasn't indexed the new run by the time we list, or another
        # dispatch of this same workflow lands in rh-data-platform in the
        # same window, `--limit 1` can return a stale or unrelated run and
        # `gh run watch` would then report that run's outcome, not ours --
        # a false-green (or false-red) deploy result. So this captures a
        # timestamp immediately before dispatching, then polls specifically
        # for a workflow_dispatch run created at or after that timestamp,
        # taking the EARLIEST such match (not just the newest run overall).
        # This is NOT a fully deterministic guarantee (Argus round 3,
        # SUGGESTION): a concurrent dispatch of this same workflow by another
        # actor in the window between our dispatch and GitHub indexing it
        # could in principle be selected instead. Accepted as a real, small
        # residual risk rather than adding a unique run-name/displayTitle
        # correlation for what is, in practice, a workflow only this job and
        # a human running a manual rollback ever dispatch.
        #
        # timeout-minutes on this step (below) bounds a hung downstream run
        # so it can't hold the deploy concurrency slot and the production
        # environment lock indefinitely. A timeout here does NOT cancel the
        # downstream rh-data-platform run -- Terraform apply/ECS
        # stabilization keeps proceeding independently, so a timeout means
        # "we stopped watching," not "the deploy failed." The trap below
        # attempts a best-effort cancellation once $RUN_ID is known, so a
        # timeout that fires after that point actually stops the downstream
        # run rather than leaving it to finish unobserved; see
        # docs/RELEASING.md for the operator-facing version of this caveat.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.rh-data-platform-token.outputs.token }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          # Small safety margin against the runner clock running ahead of
          # GitHub's servers (Argus round 3, SUGGESTION): createdAt is
          # server-assigned, so if the runner clock is even slightly fast,
          # a >= comparison against the unadjusted dispatch time could never
          # match our own run.
          DISPATCH_TIME=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-reclaw-comms.yml \
            --repo redesignhealth/rh-data-platform \
            --ref main \
            -f image_tag="$IMAGE_TAG"

          RUN_ID=""
          trap '[ -n "$RUN_ID" ] && gh run cancel "$RUN_ID" --repo redesignhealth/rh-data-platform 2>/dev/null; true' TERM
          # 20 x 15s = 5 minutes -- GitHub's own docs note workflow_dispatch
          # runs can take a while to appear in the run list under load
          # (Argus round 3, SUGGESTION: the original 60s ceiling was too
          # tight and risked a false-negative "run not found" failure).
          for _ in $(seq 1 20); do
            sleep 15
            RUN_ID=$(gh run list \
              --repo redesignhealth/rh-data-platform \
              --workflow deploy-reclaw-comms.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt | \
              jq -r --arg t "$DISPATCH_TIME" \
                '[.[] | select(.createdAt >= $t)] | sort_by(.createdAt) | .[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              break
            fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: could not find a deploy-reclaw-comms.yml run created at or after $DISPATCH_TIME -- cannot confirm the deploy succeeded." >&2
            exit 1
          fi
          echo "Watching rh-data-platform run $RUN_ID (dispatched at $DISPATCH_TIME)..."
          gh run watch "$RUN_ID" \
            --repo redesignhealth/rh-data-platform \
            --exit-status
