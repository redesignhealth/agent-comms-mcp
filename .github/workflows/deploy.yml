# Build, push to ECR (dev then prod), and deploy to ECS on every release.
# Triggered by the same release event as publish.yml; runs independently (no ordering dependency).
# IAM roles trust redesignhealth/agent-comms-mcp release tags via OIDC.
#
# Flow: deploy-dev builds the image, verifies CI passed, deploys to dev ECS,
# then promotes (by digest) to prod ECR. deploy-prod only runs ECS deploy —
# no image build or dev-role assumption needed there.
name: Deploy to ECS

on:
  release:
    types: [published]

# Serialize entire workflow runs: a second release waits for the first to finish
# rather than interleaving dev/prod steps from different releases.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      prod-image: ${{ steps.promote.outputs.prod-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify CI passed for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list \
            --repo "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --workflow CI \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No successful CI run found for ${{ github.sha }} — refusing to deploy." >&2
            exit 1
          fi

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-dev-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (dev)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build and push image (dev)
        id: push-dev
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker build -t "$DEV_IMAGE" .
          docker push "$DEV_IMAGE"
          DIGEST=$(aws ecr describe-images \
            --repository-name rh-platform-dev/apps/reclaw-comms-mcp \
            --image-ids imageTag=sha-${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "dev-image=$DEV_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current dev task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rh-reclaw-comms-dev \
            --query taskDefinition \
            --output json > /tmp/task-def-dev.json

      - name: Update app container image in dev task definition
        run: |
          python3 - <<'EOF'
          import json, sys
          IMAGE = "082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp:sha-${{ github.sha }}"
          with open('/tmp/task-def-dev.json') as f:
              td = json.load(f)
          if not any(c['name'] == 'app' for c in td['containerDefinitions']):
              print("ERROR: no container named 'app' in dev task definition", file=sys.stderr)
              sys.exit(1)
          for c in td['containerDefinitions']:
              if c['name'] == 'app':
                  c['image'] = IMAGE
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/task-def-dev.json', 'w') as f:
              json.dump(td, f)
          EOF

      - name: Deploy to ECS (dev)
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a # v2.2.0
        with:
          task-definition: /tmp/task-def-dev.json
          service: rh-reclaw-comms-dev
          cluster: rh-platform-dev-cluster
          wait-for-service-stability: true

      - name: Configure AWS credentials (prod — promote image after dev deploy verified)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Login to ECR (prod)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Promote dev image to prod ECR (by digest)
        id: promote
        env:
          DEV_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform-dev/apps/reclaw-comms-mcp@${{ steps.push-dev.outputs.digest }}
          PROD_IMAGE: 082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}
        run: |
          docker pull "$DEV_IMAGE"
          docker tag "$DEV_IMAGE" "$PROD_IMAGE"
          docker push "$PROD_IMAGE"
          echo "prod-image=$PROD_IMAGE" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::082533342824:role/rh-platform-github-actions-ecr-push-role
          aws-region: us-east-1

      - name: Download current prod task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition rh-reclaw-comms \
            --query taskDefinition \
            --output json > /tmp/task-def-prod.json

      - name: Update app container image in prod task definition
        run: |
          python3 - <<'EOF'
          import json, sys
          IMAGE = "082533342824.dkr.ecr.us-east-1.amazonaws.com/rh-platform/apps/reclaw-comms-mcp:sha-${{ github.sha }}"
          with open('/tmp/task-def-prod.json') as f:
              td = json.load(f)
          if not any(c['name'] == 'app' for c in td['containerDefinitions']):
              print("ERROR: no container named 'app' in prod task definition", file=sys.stderr)
              sys.exit(1)
          for c in td['containerDefinitions']:
              if c['name'] == 'app':
                  c['image'] = IMAGE
          for field in ['taskDefinitionArn','revision','status','requiresAttributes',
                        'compatibilities','registeredAt','registeredBy']:
              td.pop(field, None)
          with open('/tmp/task-def-prod.json', 'w') as f:
              json.dump(td, f)
          EOF

      - name: Deploy to ECS (prod)
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a # v2.2.0
        with:
          task-definition: /tmp/task-def-prod.json
          service: rh-reclaw-comms
          cluster: rh-platform-cluster
          wait-for-service-stability: true
