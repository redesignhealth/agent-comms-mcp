# Lint, type-check, and test jobs for agent-comms-mcp.
# The test job runs a Postgres service (16.6, matching docker-compose.yml)
# on the standard 5432 port.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Pinned; must be recent enough to parse this repo's uv.lock
          # revision. Matches the Dockerfile's uv pin.
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy .

      - name: Build wheel and verify package-data is included
        # Argus round 3, TECH-5822 SUGGESTION: this is the exact regression
        # class that shipped in round 1 -- instruction_registry.json was
        # silently dropped from the built wheel (a JSON file sitting next
        # to plugins.py, a bare py-module, has no setuptools package-data
        # mechanism), invisible to every other CI job here since neither
        # Docker (COPY . .) nor pytest (runs against the source tree)
        # installs from a wheel. Catches a future regression (e.g. the
        # file moving out of `providers/`, or the pyproject.toml
        # package-data stanza being dropped) before it reaches PyPI.
        run: |
          rm -rf dist/
          uv build --wheel
          uv run python -c "
          import glob, zipfile
          wheels = glob.glob('dist/*.whl')
          if len(wheels) != 1:
              raise RuntimeError(f'expected exactly one wheel in dist/, found {wheels}')
          whl = wheels[0]
          names = zipfile.ZipFile(whl).namelist()
          if 'providers/instruction_registry.json' not in names:
              raise RuntimeError(
                  f'providers/instruction_registry.json missing from wheel {whl}: {names}'
              )
          print(f'OK: providers/instruction_registry.json present in {whl}')
          "

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_comms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_comms
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.28"

      - name: Load uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .venv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install deps (dev)
        run: uv sync --frozen

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest --tb=short -q

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t agent-comms-mcp:${{ github.sha }} .
