name: Test Factory Merge Eligibility

# Unit tests for the factory auto-merge eligibility script (TECH-11016). Not a
# required check; it runs only when the script or the workflow changes.

on:
  pull_request:
    paths:
      - ".github/scripts/factory-merge-eligibility*.mjs"
      - ".github/workflows/factory-auto-merge.yml"
      - ".github/workflows/factory-auto-merge-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: factory-merge-eligibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node --test .github/scripts/
