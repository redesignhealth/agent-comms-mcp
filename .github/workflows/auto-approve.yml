# Lets an Argus code-review APPROVE verdict (from the `argus-review-loop`
# Claude Code skill) satisfy this repo's branch ruleset (main requires 1
# approving review, no bypass actors): once CI has passed and the shared
# Argus review-storage API reports an APPROVE verdict at the PR's exact head
# SHA, this workflow submits an approving PR review itself.
#
# This is a TRIMMED-DOWN port of the org-wide auto-approve.yml pattern used by
# redesignhealth/vc-hub and redesignhealth/rh-lib. This repo has no
# multi-agent GHA review matrix -- only the Argus gate below. There are exactly
# two terminal outcomes: approve, or a "waiting on Argus" comment (a third,
# implicit outcome -- CI hasn't passed yet -- is handled by simply not running
# the Argus-check steps at all).
#
# Triggers on `workflow_run` (CI completion) rather than `pull_request` directly
# so that the job executes under default-branch ref context (ref:refs/heads/main).
# This satisfies the companion IAM role's branch-ref-only trust policy, which
# prevents untrusted PR code from assuming the role to access production secrets.
# Do not switch to `pull_request` directly.
#
# IAM PREREQUISITE: The companion IAM role `rh-argus-gate-2` is provisioned via
# redesignhealth/rh-data-platform#8896 (https://github.com/redesignhealth/rh-data-platform/pull/8896).
# The role ARN is composed inline using this repo's existing `AWS_ACCOUNT_ID`
# secret: `arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/rh-argus-gate-2`.
# Until that role is provisioned and applied, the "Configure AWS credentials"
# step continues on error, and subsequent steps are skipped -- a safe, fail-closed
# default; PRs simply fall back to requiring a human review, same as today.
#
# This hardcodes a cross-repo coupling to that Terraform provisioning: if the
# role is ever renamed on the rh-data-platform side, the `role-to-assume`
# line in the "Configure AWS credentials" step below is the only place in
# this repo that needs updating to match.
name: Auto-Approve PR (Argus)

on:
  workflow_run:
    # VERIFIED: `on.workflow_run.workflows` matches on the target workflow's
    # `name:` field (its display name), NOT its file path -- unlike
    # `gh run list --workflow` and similar CLI/API calls elsewhere in this
    # repo, which do accept a filename. Must match ci.yml's `name: CI`.
    # Do not "fix" this by keying on file path again -- that was tried in an
    # earlier round and silently disabled this trigger entirely.
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check for auto-approval (manual re-trigger)"
        required: true
        type: number

concurrency:
  # NOTE: the workflow_run path keys on head_branch while the
  # workflow_dispatch path keys on pr_number, so these two trigger paths do
  # NOT serialize against each other. This is intentional, not an oversight:
  # `concurrency:` is evaluated before any step runs, so it cannot reference
  # a step output (e.g. a PR number resolved from workflow_run's raw event
  # context) -- there is no clean way to unify these two paths' keys given
  # that structural constraint. This grouping is only a best-effort
  # throughput optimization to reduce redundant runs; the actual correctness
  # guarantee against duplicate approvals is the review-dedup check in the
  # "Auto-approve PR" job step below. Do not attempt a workaround here that
  # reintroduces fragility.
  group: "auto-approve-${{ github.event.workflow_run.head_branch || github.event.inputs.pr_number }}"
  # Do not cancel an in-flight run: the TOCTOU SHA guards below already
  # handle staleness correctly, so cancellation would only risk killing a
  # valid run mid-way with no completed comment/approval either way.
  cancel-in-progress: false

# Default all jobs to no permissions; each job opts in to exactly what it needs.
permissions: {}

jobs:
  auto-approve:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      actions: read
      checks: read
      id-token: write
    steps:
      - name: Enforce default branch execution
        if: github.ref != 'refs/heads/main'
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          echo "ERROR: Auto-approve workflow must execute on refs/heads/main to ensure OIDC subject security. Current ref: $CURRENT_REF" >&2
          exit 1

      - name: Resolve PR number and SHA
        id: pr
        # Pinned to v7.0.1 for supply-chain safety (matches redesignhealth/.github's
        # wait-for-ci action's own pin).
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            // workflow_dispatch: use input directly, skip workflow_run lookup
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (pr.data.state !== 'open') {
                core.setOutput('skip', 'true');
                core.info(`PR #${prNumber} is not open (state: ${pr.data.state}). Skipping.`);
                return;
              }
              const reviewedSha = pr.data.head.sha;
              core.info(`workflow_dispatch: PR #${prNumber} SHA ${reviewedSha}`);
              core.setOutput('number', prNumber);
              core.setOutput('reviewed_sha', reviewedSha);
              core.setOutput('skip', 'false');
              return;
            }

            // workflow_run: get the workflow run that triggered this
            const runData = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            let reviewedSha = runData.data.head_sha;
            let prNumber = runData.data.pull_requests?.[0]?.number;

            // Fallback: pull_requests can be empty if the run triggered on a branch push
            // before the PR was associated. Search for open PR by head branch.
            if (!prNumber) {
              const headBranch = runData.data.head_branch;
              if (headBranch && headBranch !== 'main') {
                // Use the workflow run's own head-repository owner, not context.repo.owner --
                // for a fork-originated PR, the head repo owner is the fork's owner, so
                // context.repo.owner would never match it.
                const headOwner = runData.data.head_repository?.owner?.login ?? context.repo.owner;
                core.info(`pull_requests empty, searching for open PR on branch: ${headOwner}:${headBranch}`);
                const prs = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${headOwner}:${headBranch}`,
                  state: 'open',
                });

                // Only consider PRs targeting this repo's actual default branch -- otherwise
                // a same-named head branch with a different base could resolve to the wrong PR.
                const defaultBranch = context.payload.repository?.default_branch;
                if (!defaultBranch) {
                  core.warning(`Unable to determine default branch from event payload for branch ${headOwner}:${headBranch} -- skipping resolution rather than guessing.`);
                } else {
                  const matchingPrs = prs.data.filter(pr => pr.base.ref === defaultBranch);

                  if (matchingPrs.length > 1) {
                    core.warning(`Found ${matchingPrs.length} open PRs for branch ${headOwner}:${headBranch} targeting ${defaultBranch} -- ambiguous match, skipping resolution rather than guessing.`);
                  } else if (matchingPrs[0]) {
                    prNumber = matchingPrs[0].number;
                    // If headOwner !== context.repo.owner, this is a fork PR: the
                    // Auto-approve PR step explicitly guards against fork PRs and skips
                    // approval, but resolving the PR number correctly here still allows
                    // downstream steps to identify the PR if needed.
                  }
                }
              }
            }

            if (!prNumber) {
              core.setOutput('skip', 'true');
              core.info('No open PR associated with this workflow run');
              return;
            }

            // Validate that the reviewed SHA matches the PR's current HEAD.
            // Prevents approving unreviewed code if new commits were pushed after CI ran.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.data.state !== 'open') {
              core.setOutput('skip', 'true');
              core.info(`PR #${prNumber} is not open (state: ${pr.data.state}). Skipping.`);
              return;
            }

            if (pr.data.head.sha !== reviewedSha) {
              core.setOutput('skip', 'true');
              core.info(`SHA mismatch: CI ran on ${reviewedSha} but PR HEAD is now ${pr.data.head.sha}. Skipping to avoid approving unreviewed code.`);
              return;
            }

            core.setOutput('number', prNumber);
            core.setOutput('reviewed_sha', reviewedSha);
            core.setOutput('skip', 'false');

      - name: Check CI status (workflow_dispatch)
        if: steps.pr.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        id: ci
        # Cross-repo composite action reference -- deliberately NOT vendored
        # into this repo. Pinned to redesignhealth/.github main branch commit SHA.
        uses: redesignhealth/.github/.github/actions/wait-for-ci@80b6e4471a5f6d2542907a8501ba67cf4bda18ad # main @ 2026-08-13
        with:
          sha: ${{ steps.pr.outputs.reviewed_sha }}
          check-name: "All checks passed"
          max-retries: "10"
          retry-delay-ms: "60000"

      - name: Configure AWS credentials (Argus approval check)
        id: aws
        continue-on-error: true
        if: steps.pr.outputs.skip != 'true' && (github.event_name == 'workflow_run' || steps.ci.outputs.passed == 'true')
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # SECURITY: this role must stay branch/ref-restricted (never
          # PR-assumable) since the next step reads the prod
          # /general/prod/api-secret-key SSM parameter -- a PR-assumable role
          # here would let untrusted PR code exfiltrate that secret.
          # Triggering on workflow_run ensures this executes under default-branch
          # ref context (ref:refs/heads/main), satisfying the IAM trust policy.
          # The role is provisioned via redesignhealth/rh-data-platform#8896;
          # until applied, this step continues on error and subsequent steps
          # are skipped -- a safe, fail-closed default.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/rh-argus-gate-2
          aws-region: us-east-1

      - name: Warn on AWS credentials failure
        # continue-on-error above keeps this job non-failing during the
        # provisioning gap (see IAM PREREQUISITE note at top of file), but
        # that also means a genuine misconfiguration would otherwise fail
        # silently with no diagnostic signal -- surface it here instead.
        if: steps.aws.outcome == 'failure' && steps.pr.outputs.skip != 'true' && (github.event_name == 'workflow_run' || steps.ci.outputs.passed == 'true')
        run: echo "::warning::Failed to assume rh-argus-gate-2 IAM role -- Argus auto-approval is disabled until this is fixed. See README.md's 'CI and PR review' section for IAM prerequisites."

      - name: Check Argus approval
        if: steps.aws.outcome == 'success' && steps.pr.outputs.skip != 'true' && (github.event_name == 'workflow_run' || steps.ci.outputs.passed == 'true')
        id: argus
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWED_SHA: ${{ steps.pr.outputs.reviewed_sha }}
          # Use the actual repo slug, not a hardcoded name -- an earlier
          # revision of the org-wide pattern hardcoded the wrong repo here.
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          API_KEY=$(aws ssm get-parameter \
            --name /general/prod/api-secret-key \
            --with-decryption \
            --query 'Parameter.Value' --output text)

          if [ -z "$API_KEY" ]; then
            # A non-zero exit here would skip the later "Post Argus approval
            # required" step too (it's gated on this step succeeding),
            # producing total silence on a genuine SSM misconfiguration.
            # Match the non-2xx HTTP response case below instead: fall
            # through to "not approved" so the fallback comment still posts.
            echo "::warning::Argus API key parameter returned an empty value -- treating as not approved"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Workflow commands like ::add-mask:: are only recognized on
          # stdout, not stderr -- must run before $API_KEY is used anywhere.
          # Mask every line so embedded newlines do not leave partial credentials unmasked.
          # Trailing `|| true`: a read-loop can exit non-zero on its final
          # iteration in some shells, which would otherwise fail this whole
          # step under `set -e`.
          printf '%s\n' "$API_KEY" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done || true

          # Don't use curl -f: a non-2xx response should resolve to "not
          # approved" (falls through to the "waiting on Argus" comment step),
          # not hard-fail this step and skip that comment entirely.
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "X-API-Key: $API_KEY" \
            "https://api.core.redesignhealth.com/api/v1/code-review/storage/reviews/${REPO}/${PR_NUMBER}")
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Argus API returned HTTP $HTTP_STATUS for PR #${PR_NUMBER} -- treating as not approved"
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPROVED=$(echo "$HTTP_BODY" | python3 -c "
          import json, os, sys
          data = json.load(sys.stdin)
          rounds = data.get('rounds', [])
          reviewed_sha = os.environ['REVIEWED_SHA']
          approved = any(
              r.get('verdict') == 'APPROVE' and r.get('sha') == reviewed_sha
              for r in rounds
          )
          print('true' if approved else 'false')
          ")

          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"

          if [ "$APPROVED" = "true" ]; then
            echo "Argus approved PR #${PR_NUMBER} at SHA ${REVIEWED_SHA}"
          else
            echo "No Argus APPROVE verdict found for PR #${PR_NUMBER} at SHA ${REVIEWED_SHA}"
          fi

      - name: Auto-approve PR
        if: steps.aws.outcome == 'success' && steps.pr.outputs.skip != 'true' && (github.event_name == 'workflow_run' || steps.ci.outputs.passed == 'true') && steps.argus.outputs.approved == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWED_SHA: ${{ steps.pr.outputs.reviewed_sha }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const reviewedSha = process.env.REVIEWED_SHA;
            const shortSha = reviewedSha.substring(0, 7);
            const marker = `<!-- argus-gate-approval:${reviewedSha} -->`;

            // Best-effort label -- create it first if it doesn't already
            // exist on this repo, rather than assuming it does. Factored out
            // so it can also be (re-)applied on the already-approved path
            // below, in case a prior run approved but failed before reaching
            // this point.
            async function applyAutoApprovedLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'auto-approved',
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'auto-approved',
                  color: '0e8a16',
                  description: 'Automatically approved by the Argus auto-approve workflow',
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['auto-approved'],
              });
            }

            // De-duplicate FIRST, before the TOCTOU HEAD re-check below:
            // paginating through reviews can take multiple sequential API
            // round-trips, so doing this check AFTER the HEAD check (as an
            // earlier round did) reopens the exact TOCTOU window that check
            // exists to close -- createReview would still fire afterward
            // pinned to the now-stale reviewedSha. Match on this workflow's
            // own marker (not just bot identity/commit_id/state), so some
            // other github-actions[bot]-attributed approval on this repo
            // can't be mistaken for this gate's own.
            const existingReviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }
            );
            const alreadyApproved = existingReviews.some(review =>
              review.commit_id === reviewedSha &&
              review.user?.login === 'github-actions[bot]' &&
              review.state === 'APPROVED' &&
              review.body?.includes(marker)
            );
            if (alreadyApproved) {
              core.info(`PR #${prNumber} already approved at SHA ${reviewedSha} by github-actions[bot], skipping duplicate review`);
              // Still (re-)apply the label -- a prior run may have approved
              // successfully but failed before reaching label application.
              await applyAutoApprovedLabel();
              return;
            }

            // Re-validate PR HEAD immediately before approving (TOCTOU guard).
            // If new commits were pushed while CI or Argus was being checked,
            // abort approval to avoid approving unreviewed code. Kept as the
            // LAST check before createReview, with nothing of meaningful
            // latency in between, so this is the freshest possible signal.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.data.head.sha !== reviewedSha) {
              core.warning(`PR HEAD changed from ${reviewedSha} to ${pr.data.head.sha} before approval could be submitted. Aborting auto-approval.`);
              return;
            }

            // Guard against fork-originated PRs: this repo is internal-only
            // with no external fork contributions expected. Even though GITHUB_TOKEN
            // has pull-requests: write on this base repo, we explicitly disallow
            // auto-approving any PR where the head repository owner differs from
            // the base repository owner.
            const headOwner = pr.data.head.repo?.owner?.login;
            if (headOwner !== context.repo.owner) {
              core.info(`PR #${prNumber} originates from a fork (${headOwner ?? 'unknown'}). Skipping auto-approval.`);
              return;
            }

            // Pinned to the exact commit that was reviewed -- never approve
            // if the PR has moved since CI/Argus were checked above.
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: reviewedSha,
              event: 'APPROVE',
              body: [
                marker,
                '## Auto-Approved (Argus)',
                '',
                `CI passed and Argus reached an APPROVE verdict for this PR at commit \`${shortSha}\`.`,
                '',
                '### Checks Passed',
                '- CI (lint + type check + tests + Docker build)',
                '- Argus: APPROVE',
                '',
                '---',
                '*This auto-approval was generated by the Argus auto-approve workflow. A human reviewer may still review if desired.*',
              ].join('\n'),
            });

            await applyAutoApprovedLabel();

            core.info(`PR #${prNumber} auto-approved at ${reviewedSha}`);

      - name: Post Argus approval required
        if: steps.aws.outcome == 'success' && steps.pr.outputs.skip != 'true' && (github.event_name == 'workflow_run' || steps.ci.outputs.passed == 'true') && steps.argus.outputs.approved != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWED_SHA: ${{ steps.pr.outputs.reviewed_sha }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const reviewedSha = process.env.REVIEWED_SHA;
            const shortSha = reviewedSha.substring(0, 7);
            const marker = `<!-- argus-gate-pending:${reviewedSha} -->`;

            // De-duplicate: paginate through all comments to skip if already
            // posted for this exact full SHA by github-actions[bot].
            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              }
            );
            const alreadyPosted = existingComments.some(c =>
              c.user?.login === 'github-actions[bot]' &&
              c.user?.type === 'Bot' &&
              c.body?.includes(marker)
            );
            if (alreadyPosted) {
              core.info(`Argus approval required comment already posted for SHA ${reviewedSha}, skipping duplicate`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                marker,
                '## Argus Approval Required',
                '',
                `No Argus APPROVE verdict found for this PR at SHA \`${shortSha}\`.`,
                '',
                'To unblock auto-approval:',
                `1. In a Claude Code session, run: \`/argus-review-loop ${prNumber}\``,
                '2. Iterate until Argus reaches an APPROVE verdict',
                '3. This workflow re-checks automatically when CI completes after the next push to this PR',
                '',
                'To bypass, request a human reviewer directly.',
                '',
                '---',
                '*This check is enforced by the Argus auto-approve workflow.*',
              ].join('\n'),
            });
